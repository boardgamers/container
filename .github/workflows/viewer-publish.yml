name: Viewer - Version and Release

on:
    workflow_dispatch:
        inputs:
            newversion:
                description: 'Semantic Version Bump Type (major minor patch)'
                default: patch

env:
    node_version: 24

defaults:
    run:
        working-directory: viewer

jobs:
    version_and_release:
        runs-on: ubuntu-latest
        permissions:
            contents: write # git push --follow-tags
            id-token: write # OIDC trusted publishing
        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js ${{ env.node_version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node_version }}
                  # registry-url is required so npm publish targets the public npm registry
                  registry-url: 'https://registry.npmjs.org'
            - run: npm install -g pnpm@11
            - run: pnpm install --frozen-lockfile
            - run: git config --global user.name github-actions
            - run: git config --global user.email bot@github.com
            - run: yarn config set version-git-message "Viewer v%s"
            - run: yarn version --${{ github.event.inputs.newversion }}
            - run: sed -i 's:"container-viewer":"@boardgamers/container-viewer":' package.json
            # pnpm supports OIDC trusted publishing and rewrites workspace dependencies.
            # No NODE_AUTH_TOKEN: publishing authenticates with the OIDC token.
            - run: pnpm publish . --access public --no-git-checks
            - run: git push --follow-tags
