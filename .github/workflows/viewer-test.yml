name: Viewer - Test
on:
    push:
        paths:
            - '.github/workflows/viewer-test.yml'
            - 'viewer/**'
            - 'engine/**'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
        branches:
            - master
    pull_request:
        paths:
            - '.github/workflows/viewer-test.yml'
            - 'viewer/**'
            - 'engine/**'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'

defaults:
    run:
        working-directory: viewer

jobs:
    test_and_build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
            - uses: pnpm/action-setup@v4
              with:
                  version: 11
            - run: pnpm install --frozen-lockfile
            - run: pnpm --dir .. test:locales
            - run: pnpm check
            - run: pnpm test:unit
            - run: pnpm test:tutorial
            - run: pnpm build
            - run: pnpm --dir ../engine build
            - run: pnpm package
            - run: pnpm exec playwright install --with-deps chromium
            - run: pnpm test:browser
            - run: pnpm test:offshore:browser
            - run: pnpm test:tutorial:browser
