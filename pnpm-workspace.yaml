packages:
    - 'viewer'
    - 'engine'
# esbuild installs and validates the platform binary used by Vite. Other listed
# dependency lifecycle scripts are unnecessary for this workspace.
allowBuilds:
    esbuild: true
    '@parcel/watcher': false
    core-js: false
    ejs: false
    fsevents: false
    nodent-runtime: false
    yorkie: false

# Keep peer dependencies explicit and frozen installs reproducible.
autoInstallPeers: false

minimumReleaseAgeExclude:
    - '@boardgamers/protocol@0.2.2 || 0.3.0 || 0.3.1 || 0.3.3 || 0.4.0 || 0.4.2 || 0.5.0 || 0.6.0 || 0.6.1 || 0.6.2 || 0.8.1 || 0.10.0 || 0.11.0'
