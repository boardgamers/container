packages:
    - 'viewer'
    - 'engine'
# Dependency build scripts are not needed: everything installs and builds with them
# skipped (core-js/ejs postinstalls are ads, @parcel/watcher ships prebuilds, yorkie
# is superseded by husky). Explicit so pnpm doesn't error on unreviewed builds.
allowBuilds:
    '@parcel/watcher': false
    core-js: false
    ejs: false
    nodent-runtime: false
    yorkie: false

# vue2 project: without this, pnpm auto-installs @vue/cli's optional @vue/compiler-sfc
# (vue 3) peer and the cli-plugin-typescript shim crashes the viewer build (CI-only,
# fresh installs). vue-template-compiler is the correct vue2 path.
autoInstallPeers: false
